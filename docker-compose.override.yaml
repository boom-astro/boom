# Overrides for local development

services:
  proxy:
    image: traefik:v3.6.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"
      - "8090:8080"
    # Duplicate the command from docker-compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default
  # Overrides to run the scheduler for ZTF in dev mode with cargo-watch, which
  # automatically rebuilds and restarts the container when source files change.
  scheduler-ztf:
    env_file:
      - .env
    environment:
      BOOM_KAFKA__PRODUCER__SERVER: broker:29092
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    command:
      - cargo
      - watch
      # A checkout rewrites many watched files at once. Without a delay the
      # first one starts a build and the rest queue behind it, so one branch
      # switch costs several full rebuilds, serialized on the shared target
      # volume. Debounced, it costs one.
      - --delay
      - "5"
      - --watch
      - src
      - --watch
      - apache-avro-macros
      - --watch
      - Cargo.toml
      - --watch
      - Cargo.lock
      - --ignore
      - target
      - -x
      - run --bin scheduler -- ztf --config /app/config.yaml
    # `!override` discards the volume list inherited from the production
    # compose rather than adding to it, because the inherited list mounts
    # config.yaml and a couple of data files *individually* -- and a bind mount
    # of a single file is pinned to that file's inode. `git checkout` replaces
    # files instead of editing them, so a branch switch orphans every such
    # mount: the container gets "No such file or directory" for a file sitting
    # right there on the host, cargo-watch loops on that forever, the container
    # never exits, the restart policy never fires, and the service goes quietly
    # unhealthy until someone notices. Mounting the working tree as one
    # directory survives the replacement, because a directory mount is resolved
    # per lookup. Those single-file mounts are right for a deployment, where
    # nothing switches branches underneath; they are a trap in dev.
    volumes: !override
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/app/target
  scheduler-lsst:
    env_file:
      - .env
  mongo:
    env_file:
      - .env
    ports:
      - "27017:27017"
  valkey:
    ports:
      - "6379:6379"
  broker:
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # Limit heap + use G1GC with fewer threads (auto-tuned based on heap size)
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      # Increase timeouts for slower CI environments
      KAFKA_SOCKET_CONNECTION_SETUP_TIMEOUT_MS: 30000
      KAFKA_SOCKET_CONNECTION_SETUP_TIMEOUT_MAX_MS: 60000
  # Runs queued tasks in dev, the same way the prod task-worker service does.
  #
  # `uv sync --frozen` before cargo-watch, so boompy's environment exists before
  # the first ingest needs it and a drifted lockfile fails here.
  task-worker:
    env_file:
      - .env
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        # `git rev-parse HEAD` at compose time; blank if unset, which the
        # ledger records as an unknown commit rather than a fake one.
        BOOM_GIT_SHA: ${BOOM_GIT_SHA:-}
    working_dir: /app
    environment:
      BOOM_CATALOG_DATA_PATH: /app/data/catalogs
      BOOM_BOOMPY_PATH: /app/boompy
      UV_PROJECT_ENVIRONMENT: /app/boompy/.venv
    entrypoint:
      # `-c`, not `-lc`: a login shell sources /etc/profile and replaces the
      # PATH the rust image sets, losing cargo.
      - /bin/bash
      - -c
    command:
      - >-
        uv sync --project /app/boompy --frozen --no-dev &&
        exec cargo watch
        --delay 5
        --watch src --watch apache-avro-macros
        --watch Cargo.toml --watch Cargo.lock
        --ignore target
        -x "run --bin task_worker -- --config /app/config.yaml"
    # `!override` discards the volume list inherited from the production
    # compose rather than adding to it, because the inherited list mounts
    # config.yaml and a couple of data files *individually* -- and a bind mount
    # of a single file is pinned to that file's inode. `git checkout` replaces
    # files instead of editing them, so a branch switch orphans every such
    # mount: the container gets "No such file or directory" for a file sitting
    # right there on the host, cargo-watch loops on that forever, the container
    # never exits, the restart policy never fires, and the service goes quietly
    # unhealthy until someone notices. Mounting the working tree as one
    # directory survives the replacement, because a directory mount is resolved
    # per lookup. Those single-file mounts are right for a deployment, where
    # nothing switches branches underneath; they are a trap in dev.
    volumes: !override
      - .:/app
      # The venv is built inside the container: a host one would carry macOS
      # wheels into a Debian image.
      - boompy-venv:/app/boompy/.venv
      - catalog_data:/app/data/catalogs
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/app/target

  # Overrides to run the API in dev mode with cargo-watch, which automatically
  # rebuilds and restarts the container when source files change.
  api:
    env_file:
      - .env
    environment:
      # Stats endpoint queries Kafka via kafka.producer.server; point it at the
      # in-network broker listener (config.yaml defaults to localhost:9092, which
      # is unreachable from inside the api container).
      BOOM_KAFKA__PRODUCER__SERVER: broker:29092
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    command:
      - cargo
      - watch
      # A checkout rewrites many watched files at once. Without a delay the
      # first one starts a build and the rest queue behind it, so one branch
      # switch costs several full rebuilds, serialized on the shared target
      # volume. Debounced, it costs one.
      - --delay
      - "5"
      - --watch
      - src
      - --watch
      - apache-avro-macros
      - --watch
      - Cargo.toml
      - --watch
      - Cargo.lock
      - --ignore
      - target
      - -x
      - run --bin api
    # `!override` discards the volume list inherited from the production
    # compose rather than adding to it, because the inherited list mounts
    # config.yaml and a couple of data files *individually* -- and a bind mount
    # of a single file is pinned to that file's inode. `git checkout` replaces
    # files instead of editing them, so a branch switch orphans every such
    # mount: the container gets "No such file or directory" for a file sitting
    # right there on the host, cargo-watch loops on that forever, the container
    # never exits, the restart policy never fires, and the service goes quietly
    # unhealthy until someone notices. Mounting the working tree as one
    # directory survives the replacement, because a directory mount is resolved
    # per lookup. Those single-file mounts are right for a deployment, where
    # nothing switches branches underneath; they are a trap in dev.
    volumes: !override
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/app/target
    ports:
      - "4000:4000"
  # Run the frontend in dev mode with the Vite dev server, which provides hot
  # module reload: source is bind-mounted, so edits on the host rebuild live in
  # the container. /api requests are proxied to the api service over the network.
  frontend:
    build:
      # Root context so the build can bundle docs/babamul.md (see frontend/Dockerfile).
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    working_dir: /app
    command:
      - bun
      - run
      - dev
      - --host
      - 0.0.0.0
      - --port
      - "5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
    volumes: !override
      # One directory, for the reason the Rust services give above: a branch
      # switch that rewrites vite.config.ts or a tsconfig would orphan a
      # single-file mount and take the dev server down with it.
      - ./frontend:/app
      # Bundled docs source, kept live so edits to the canonical doc show up in
      # dev (imported via ?raw in src/components/KafkaMarkdownDocs.tsx).
      - ./docs:/app/docs:ro
      # Anonymous volume so the host (which has no node_modules) doesn't shadow
      # the dependencies installed in the image.
      - /app/node_modules
    ports:
      - "5173:5173"
  # Run consumer in dev mode with cargo-watch, which automatically rebuilds and
  # restarts the container when source files change.
  consumer-ztf:
    env_file:
      - .env
    environment:
      BOOM_KAFKA__CONSUMER__ZTF__SERVER: broker:29092
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    command:
      - cargo
      - watch
      # A checkout rewrites many watched files at once. Without a delay the
      # first one starts a build and the rest queue behind it, so one branch
      # switch costs several full rebuilds, serialized on the shared target
      # volume. Debounced, it costs one.
      - --delay
      - "5"
      - --watch
      - src
      - --watch
      - apache-avro-macros
      - --watch
      - Cargo.toml
      - --watch
      - Cargo.lock
      - --ignore
      - target
      - -x
      - run --bin kafka_consumer -- ztf --on 20240617 --programids public --config /app/config.yaml
    # `!override` discards the volume list inherited from the production
    # compose rather than adding to it, because the inherited list mounts
    # config.yaml and a couple of data files *individually* -- and a bind mount
    # of a single file is pinned to that file's inode. `git checkout` replaces
    # files instead of editing them, so a branch switch orphans every such
    # mount: the container gets "No such file or directory" for a file sitting
    # right there on the host, cargo-watch loops on that forever, the container
    # never exits, the restart policy never fires, and the service goes quietly
    # unhealthy until someone notices. Mounting the working tree as one
    # directory survives the replacement, because a directory mount is resolved
    # per lookup. Those single-file mounts are right for a deployment, where
    # nothing switches branches underneath; they are a trap in dev.
    volumes: !override
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/app/target
  otel-collector:
    ports:
      - "4317:4317"   # OTLP gRPC receiver (from Rust OTLP exporter)
      - "55679:55679" # zpages extension
      - "13133:13133" # health_check extension
  prometheus:
    ports:
      - "9090:9090"
  loki:
    ports:
      - "3100:3100"
  tempo:
    ports:
      - "3200:3200"
  node-exporter:
    ports:
      - "9100:9100"
  kafka-exporter:
    ports:
      - "9308:9308"
  grafana:
    environment:
      # Enable dashboard editing in dev mode
      GRAFANA_DASHBOARD_EDITABLE: "true"
    ports:
      - "3000:3000"
    volumes:
      # Override to make provisioning directory writable so the dashboard provisioning script can configure it
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./scripts/grafana-dashboard-provisioning.sh:/scripts/grafana-dashboard-provisioning.sh:ro

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false

volumes:
  cargo-registry:
  cargo-git:
  target:
  # boompy's resolved environment, built in the container by `uv sync`.
  boompy-venv:
