[project]
name = "boompy"
version = "0.1.0"
description = "Internal Python add-on for BOOM. Runs inside the BOOM cluster; not a client library."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    # Reads the archives BOOM sources catalogs from, and converts the awkward
    # formats to parquet so Rust only ever reads one columnar format.
    "astropy>=6.0",
    "lsdb>=0.6",
    "pandas>=2.0",
    "pyarrow>=17",
    # Pan-STARRS is served from a requester-pays S3 bucket. botocore comes with
    # s3fs, but it is named here because the ingest resolves credentials through
    # it directly to refuse the fetch before it starts.
    "s3fs>=2024.6",
    "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boompy"]

[tool.ruff]
# Matches the repo-wide Python convention; `prek`/pre-commit enforces it.
line-length = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test tree mirrors the package tree, so two modules under different
# packages can want the same test file name. `importlib` imports each by path
# instead of by top-level module name, which is what makes that legal without
# littering the tree with `__init__.py`.
addopts = "--import-mode=importlib"
