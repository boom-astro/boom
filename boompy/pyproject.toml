[project]
name = "boompy"
version = "0.1.0"
description = "Internal Python add-on for BOOM. Runs inside the BOOM cluster; not a client library."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "lsdb>=0.6",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boompy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
