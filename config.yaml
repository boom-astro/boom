      max_results: 50
      projection:
        _id: 1
        ra: 1
        dec: 1
        objtype: 1
        z: 1
        z_unc: 1
        # NED-LVS FITS column names verbatim, as the catalog ingest writes them.
        Diam: 1
        Diam_ba: 1
        Diam_pa: 1
        # 2MASS diameters carry a position angle fixed at 90 degrees whether or
        # not the source is elongated, so the provenance is needed to flag them.
        Diam_survey: 1
        DistMpc: 1
        DistMpc_method: 1
        m_Ks: 1 # inert until use_absmag is implemented
        m_Ks_unc: 1
    - catalog: DESI_DR1
      radius: 30.0 # 30 arcseconds
      use_distance: true
      distance_key: "z"
      distance_max: 30.0
      distance_max_near: 300.0
      projection:
        _id: 1
        ra: 1
        dec: 1
        z: 1
        zerr: 1
        zwarn: 1
        chi2: 1
        deltachi2: 1
        spectype: 1
        zcat_nspec: 1
    - catalog: LS_DR10_PHOTOZ
      radius: 30.0 # 30 arcseconds
      use_distance: true
      distance_key: "z_phot"
      distance_max: 60.0
      distance_max_near: 300.0
      projection:
        _id: 1
        ra: 1
        dec: 1
        ra_err: 1
        dec_err: 1
        z_phot: 1
        z_phot_err: 1
        photo_z_type: 1
  decam: []
  winter:
    - catalog: PS1_DR1
      radius: 2.0 # 2 arcseconds
      use_distance: false
      projection:
        _id: 1
        gMeanPSFMag: 1
        gMeanPSFMagErr: 1
        rMeanPSFMag: 1
        rMeanPSFMagErr: 1
        iMeanPSFMag: 1
        iMeanPSFMagErr: 1
