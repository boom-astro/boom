database:
  host: localhost
  port: 27017
  name: boom
  max_pool_size: 200
  replica_set: null
  username: mongoadmin
  password: "" # Set via BOOM_DATABASE__PASSWORD environment variable
  srv: false
api:
  domain: "localhost" # Set via BOOM_API__DOMAIN environment variable
  port: 4000 # Set via BOOM_API__PORT environment variable
  auth:
    secret_key: "" # Set via BOOM_API__AUTH__SECRET_KEY environment variable
    token_expiration: 604800 # JWT token expiration in seconds (7 days) -- must be > 0
    admin_username: admin
    admin_password: "" # Set via BOOM_API__AUTH__ADMIN_PASSWORD environment variable
    admin_email: admin@example.com
babamul:
  enabled: false # Set via BOOM_BABAMUL__ENABLED environment variable
  webapp_url: # Set via BOOM_BABAMUL__WEBAPP_URL environment variable
  retention_days: 3
posthog:
  # Server-side product analytics for the Babamul API and Kafka stream.
  # Leave project_api_key empty to disable analytics entirely.
  project_api_key: "" # Set via BOOM_POSTHOG__PROJECT_API_KEY environment variable
  host: "https://us.i.posthog.com" # Set via BOOM_POSTHOG__HOST environment variable
  flush_interval_seconds: 10
  queue_capacity: 10000
  # How often Babamul Kafka consumer groups are sampled to attribute stream
  # consumption to users. Also drives the Grafana consumption metrics.
  consumption_interval_seconds: 300
gpu:
  enabled: false # Set to true to load ONNX models on GPU (CUDA) instead of CPU.
  # Models are loaded once at startup and shared across all enrichment workers.
  # When false, models are loaded on CPU (BOOM_GPU__ENABLED env var is still respected).
  device_ids: [0] # CUDA device(s) to use. E.g. [0,1,2,3,4,5,6,7] for 8 GPUs.
  # ONNX models are loaded on the first device. Additional devices are available
  # for the GPU pool (future lightcurve fitting).
  # Overwrite with BOOM_GPU__DEVICE_IDS environment variable (comma-separated list).
redis:
  host: localhost
  port: 6379
kafka:
  consumer:
    ztf:
      server: "localhost:9092"
      group_id: "" # Set via BOOM_KAFKA__CONSUMER__ZTF__GROUP_ID environment variable
      # Days before the current one to stay subscribed to. 1 keeps yesterday
      # alongside today so a night spanning UTC midnight isn't cut off. Raise
      # temporarily (via BOOM_KAFKA__CONSUMER__ZTF__SUBSCRIPTION_WINDOW_DAYS) to
      # catch up after an upstream outage, then set it back; upstream retention
      # (~7 days for ZTF) bounds what a lookback can recover.
      subscription_window_days: 1
    lsst:
      server: "rubin-alert-stream-bootstrap.slac.stanford.edu:9094"
      schema_registry: "https://rubin-alert-schemas.slac.stanford.edu/schema-registry"
      schema_github_fallback_url: "https://github.com/lsst/alert_packet/tree/main/python/lsst/alert/packet/schema"
      group_id: "" # Set via BOOM_KAFKA__CONSUMER__LSST__GROUP_ID environment variable
      username: "" # Set via BOOM_KAFKA__CONSUMER__LSST__USERNAME environment variable
      password: "" # Set via BOOM_KAFKA__CONSUMER__LSST__PASSWORD environment variable
    decam:
      server: "localhost:9092"
      group_id: "" # Set via BOOM_KAFKA__CONSUMER__DECAM__GROUP_ID environment variable
    winter:
      server: "localhost:9092"
      group_id: "" # Set via BOOM_KAFKA__CONSUMER__WINTER__GROUP_ID environment variable
  producer:
    server: "localhost:9092" # Only one global producer for now (filter worker output)
# cutouts_storage configures where alert cutout images are stored.
#
# type: "mongo" (default) stores cutouts in MongoDB.
#       "s3"    stores them in an S3-compatible bucket (e.g. rustfs).
# Switch backends without editing this file by setting BOOM_CUTOUTS_STORAGE__TYPE.
# Every field below can also be overridden via BOOM_CUTOUTS_STORAGE__<FIELD>
# (e.g. BOOM_CUTOUTS_STORAGE__HOST). For Docker deployments the compose overlays
# inject the correct type and all infrastructure settings automatically —
# see README for the three cutout storage modes.
cutouts_storage:
  type: mongo  # or set via BOOM_CUTOUTS_STORAGE__TYPE

  # --- MongoDB settings (active when type: mongo) ---
  host: localhost      # or set via BOOM_CUTOUTS_STORAGE__HOST
  port: 27017
  name: boom           # same database as alerts; or set via BOOM_CUTOUTS_STORAGE__NAME
  max_pool_size: 200
  replica_set: null
  username: mongoadmin  # or set via BOOM_CUTOUTS_STORAGE__USERNAME
  password: ""          # or set via BOOM_CUTOUTS_STORAGE__PASSWORD
  srv: false

  # --- S3 settings (active when type: s3) ---
  # All surveys share a single bucket, namespaced by a per-survey key prefix
  # (e.g. ztf/12345.json, lsst/67890.json). This lets you point boom at a
  # pre-provisioned remote bucket without creating one bucket per survey.
  # Per-survey S3 lifecycle rules can still be applied using prefix filters.
  bucket_name: boom-cutouts         # or set via BOOM_CUTOUTS_STORAGE__BUCKET_NAME
  region: local                     # or set via BOOM_CUTOUTS_STORAGE__REGION
  # endpoint_url is optional. Set it for S3-compatible services (rustfs, MinIO, Wasabi, …).
  # Omit it when pointing at AWS S3 — the SDK derives the endpoint from the region automatically.
  # Docker compose overlays inject this automatically; set BOOM_CUTOUTS_STORAGE__ENDPOINT_URL
  # when running binaries directly against a non-AWS provider.
  endpoint_url: http://rustfs:9000
  access_key: ""                    # or set via BOOM_CUTOUTS_STORAGE__ACCESS_KEY
  secret_key: ""                    # or set via BOOM_CUTOUTS_STORAGE__SECRET_KEY
  credentials_provider: rustfs      # or set via BOOM_CUTOUTS_STORAGE__CREDENTIALS_PROVIDER
  cache:
    host: valkey-cutouts  # or set via BOOM_CUTOUTS_STORAGE__CACHE__HOST
    port: 6379             # or set via BOOM_CUTOUTS_STORAGE__CACHE__PORT
    ttl_seconds: 30        # or set via BOOM_CUTOUTS_STORAGE__CACHE__TTL_SECONDS
    max_memory: "1024mb"   # or set via BOOM_CUTOUTS_STORAGE__CACHE__MAX_MEMORY
workers:
  ztf:
    command_interval: 500
    alert:
      n_workers: 3
    enrichment:
      n_workers: 3
      # Alerts per enrichment batch: the queue RPOP cap AND the fixed ONNX
      # inference shape. Partial batches are zero-padded so ORT sees one shape
      # and the GPU memory arena stays stable. 750 is stable for both VRAM => 12GB.
      # Caltech and MSI can handle 1000.
      batch_size: 1000
    filter:
      n_workers: 3
      refresh_interval_minutes: 15
      # On activation, filters are validated against a designated reference night.
      # If more than max_match_rate percent of alerts pass, the filter is not validated.
      max_match_rate: 5
      reference_night: "2026-03-16"
  lsst:
    command_interval: 500
    alert:
      n_workers: 4
    enrichment:
      n_workers: 3
    filter:
      n_workers: 1
      refresh_interval_minutes: 15
      max_match_rate: 5
      reference_night: "2026-02-23"
  decam:
    command_interval: 500
    alert:
      n_workers: 1
    enrichment:
      n_workers: 1
    filter:
      n_workers: 1
      refresh_interval_minutes: 15
      max_match_rate: 5
      reference_night:
  winter:
    command_interval: 500
    alert:
      n_workers: 1
    enrichment:
      n_workers: 1
    filter:
      n_workers: 1
      refresh_interval_minutes: 15
      max_match_rate: 100
      reference_night: "2026-07-15"
# host_galaxy configures shape-aware host-galaxy association, which scores each
# galaxy cross-match by its directional light radius (d_DLR) instead of a fixed
# circular aperture. The result is stored on the alert aux document under
# `host_galaxy`, and filters cut on `host_galaxy.best_host.d_dlr`.
#
# Enabling this requires the galaxy catalogs below to be ingested AND listed in
# the survey's `crossmatch` block, so their shape columns are projected into the
# match documents:
#   NED_LVS  -> Diam, Diam_ba, Diam_pa, Diam_survey
#               (plus DistMpc, DistMpc_method, z)
#   LSDR10   -> shape_r, shape_e1, shape_e2, objtype, flux_r
#               and, where the ingest provides them: sersic, flux_ivar_r,
#               fracflux_r
#
# The three optional Legacy columns each degrade a specific step rather than
# failing: without `sersic` a SER row has no index and keeps its half-light
# radius (reported as `size_is_isophotal: false`), without `flux_ivar_r` a REX
# row cannot be judged on signal-to-noise and is decided on size and blending
# alone, and without `fracflux_r` a row is taken as unblended.
# Field names are the ones the catalog ingest writes, which are not always the
# source column names: the Legacy `type` column is stored as `objtype`.
# NED-LVS is preferred where it has a diameter; Legacy Survey fills in the rest.
host_galaxy:
  enabled: false
  ned_lvs_catalog: NED_LVS
  ls_dr10_catalog: LSDR10 # collection name as ingested; UMN uses LSDR10
  max_dlr: 5.0            # admission cutoff; filters should cut tighter (~4)
  min_axis_arcsec: 0.05
  max_candidates: 10
  exclude_star_like: true # drop LS_DR10 point sources, which have no extent
  star_type_value: PSF
  use_redshift: true
  # Round-exponential rejection. REX fits marginally resolved sources, and about
  # half of them are too small, too faint, or too blended to be a believable
  # host. These sit in sensitive parts of the parameter space, so changing them
  # moves results materially.
  rex_min_shape_r_arcsec: 0.3
  rex_min_snr: 5.0
  rex_max_fracflux: 0.5
  # Legacy half-light radii are converted to this isophote so they rank on the
  # same scale as NED-LVS D25 diameters.
  isophote_mag: 25.0
crossmatch:
  ztf:
    - catalog: PS1_DR1
      radius: 2.0 # 2 arcseconds
      use_distance: false
      projection:
        _id: 1
        gMeanPSFMag: 1
        gMeanPSFMagErr: 1
        rMeanPSFMag: 1
        rMeanPSFMagErr: 1
        iMeanPSFMag: 1
        iMeanPSFMagErr: 1
        zMeanPSFMag: 1
        zMeanPSFMagErr: 1
        yMeanPSFMag: 1
        yMeanPSFMagErr: 1
        ra: 1
        dec: 1
    - catalog: Gaia_DR3
      radius: 2.0 # 2 arcseconds
      use_distance: false
      projection:
        _id: 1
        parallax: 1
        parallax_error: 1
        phot_g_mean_mag: 1
        phot_bp_mean_mag: 1
        phot_rp_mean_mag: 1
        ra: 1
        dec: 1
    - catalog: milliquas_v6
      radius: 2.0 # 2 arcseconds
      use_distance: false
      projection:
        _id: 1
        Name: 1
        Descrip: 1
        Qpct: 1
        ra: 1
        dec: 1
    - catalog: NED
      radius: 300.0 # 300 arcseconds
      use_distance: true
      distance_key: "z"
      distance_max: 30.0
      distance_max_near: 300.0
      projection:
        _id: 1
        ra: 1
        dec: 1
        objtype: 1
        z: 1
        z_unc: 1
        z_tech: 1
        z_qual: 1
        DistMpc: 1
        DistMpc_unc: 1
        ebv: 1
        m_Ks: 1
        m_Ks_unc: 1
        tMASSphot: 1
        Mstar: 1
        Mstar_unc: 1
    - catalog: NED_LVS
      # Reads the NED collection, which holds the NED-LVS sample. Kept as its
      # own entry rather than folded into the NED one: angular_size_key takes
      # precedence over use_distance, so merging them would silently change
      # matching for every existing NED consumer.
      collection: NED
      # Feeds host_galaxy association. use_distance is false on purpose: the
      # redshift-scaled circle is exactly what d_DLR replaces.
      # Each galaxy gets its own match radius from diam (angular major-axis
      # diameter), so M31 is still returned a degree out while a dwarf is not.
      # The base cone applies to every row; only galaxies large enough to reach
      # past it pay for the wider search, capped at angular_size_radius_max.
      radius: 300.0 # base cone, arcsec
      use_distance: false
      angular_size_key: Diam
      # Must be >= host_galaxy.max_dlr: d_DLR <= N implies sep <= N * semi-major,
      # so a smaller scale here would silently drop candidates the association
      # would otherwise have considered.
      angular_size_scale: 5.0
      angular_size_radius_max: 21600.0 # 6 deg, enough for the LMC
      max_results: 50
      projection:
        _id: 1
        ra: 1
        dec: 1
        objtype: 1
        z: 1
        z_unc: 1
        # NED-LVS FITS column names verbatim, as the catalog ingest writes them.
        Diam: 1
        Diam_ba: 1
        Diam_pa: 1
        # 2MASS diameters carry a position angle fixed at 90 degrees whether or
        # not the source is elongated, so the provenance is needed to flag them.
        Diam_survey: 1
        DistMpc: 1
        DistMpc_method: 1
        m_Ks: 1 # inert until use_absmag is implemented
        m_Ks_unc: 1
    - catalog: DESI_DR1
      radius: 30.0 # 30 arcseconds
      use_distance: true
      distance_key: "z"
      distance_max: 30.0
      distance_max_near: 300.0
      projection:
        _id: 1
        ra: 1
        dec: 1
        z: 1
        zerr: 1
        zwarn: 1
        chi2: 1
        deltachi2: 1
        spectype: 1
        zcat_nspec: 1
    - catalog: LS_DR10_PHOTOZ
      radius: 30.0 # 30 arcseconds
      use_distance: true
      distance_key: "z_phot"
      distance_max: 60.0
      distance_max_near: 300.0
      projection:
        _id: 1
        ra: 1
        dec: 1
        ra_err: 1
        dec_err: 1
        z_phot: 1
        z_phot_err: 1
        photo_z_type: 1
  lsst:
    - catalog: LSPSC
      radius: 30.0 # 30 arcseconds
      use_distance: false
      projection:
        _id: 1
        ra: 1
        dec: 1
        score: 1
        magwhite: 1
      max_results: 3 # 3 nearest neighbors
    - catalog: NED
      radius: 300.0 # 300 arcseconds
      use_distance: true
      distance_key: "z"
      distance_max: 30.0
      distance_max_near: 300.0
      projection:
        _id: 1
        ra: 1
        dec: 1
        objtype: 1
        z: 1
        z_unc: 1
        z_tech: 1
        z_qual: 1
        DistMpc: 1
        DistMpc_unc: 1
        ebv: 1
        m_Ks: 1
        m_Ks_unc: 1
        tMASSphot: 1
        Mstar: 1
        Mstar_unc: 1
    - catalog: NED_LVS
      # Reads the NED collection, which holds the NED-LVS sample. Kept as its
