apiVersion: 1

groups:
  - orgId: 1
    name: infrastructure
    folder: boom
    interval: 1m
    rules:
      - uid: disk-fills-in-24h
        title: Disk will fill within 24 hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600  # 6h linear regression window
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              # Returns predicted available bytes 24h from now (negative => projected to fill).
              # The threshold step below fires when this is < 0.
              expr: |
                predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24*60*60)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }} {{ $labels.mountpoint }} is projected to fill within 24h'
          description: 'predict_linear over 6h shows the filesystem hitting 0 bytes within the next 24h.'

      - uid: container-restart-flapping
        title: Container is flapping (restarted >3 times in 1h)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |
                sum by (name) (changes(container_start_time_seconds{name!=""}[1h])) > 3
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} restarted >3 times in the last hour'
          description: 'The container start_time has rolled over more than 3 times in the past hour, indicating crash-loop behavior.'

      - uid: cpu-throttling
        title: Container is being CPU-throttled
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |
                sum by (name) (rate(container_cpu_cfs_throttled_seconds_total{name!=""}[5m]))
                  / clamp_min(sum by (name) (rate(container_cpu_cfs_periods_total{name!=""}[5m])), 1)
                  > 0.25
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.name }} CPU-throttled >25% of CFS periods'
          description: 'The container is being throttled against its CPU quota; consider raising the cpu limit or rebalancing the workload.'

      - uid: otel-collector-dropped-metrics
        title: OTel Collector is dropping metric points
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |
                sum(rate(otelcol_exporter_send_failed_metric_points_total[5m])) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: OTel Collector exporter is failing to send metric points
          description: 'Check otel-collector logs and the downstream Prometheus OTLP receiver for errors.'

      - uid: api-down
        title: API is down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              # docker_container_up is 0 when the container is not running OR is
              # failing its Docker healthcheck. The healthcheck arm is the one
              # that matters: in #562 every request panicked its actix worker, so
              # `/` failed forever while the process itself stayed alive and the
              # container kept running. Nothing else in the stack saw that --
              # cAdvisor reports resource usage, not health, and the container
              # never restarted, so container-restart-flapping stayed silent too.
              #
              # min() so that any unhealthy replica trips this, not just an
              # average across them.
              #
              # The `or on() vector(0)` catches the series disappearing while
              # the exporter is still healthy -- the container removed,
              # renamed, or relabelled out of the selector. That is a real
              # outage, and without this it would only ever surface as a
              # DatasourceNoData notification, losing the summary and
              # description below. The `on()` is load-bearing: `or` keeps
              # right-hand samples whose labels match nothing on the left, and
              # bare vector(0) has no labels to match the `by (compose_service)`
              # result, so a plain `or` would leak a permanent 0-valued series
              # alongside the healthy one and page forever.
              #
              # The `and on()` gate then excludes the other reason the series
              # can disappear: the scrape itself failing, which stales every
              # series of the target at the same instant `up` goes to 0. The
              # gate empties the result in that case, so the rule sees NoData
              # rather than a spurious vector(0), and observability-blind below
              # pages for it under its own name.
              expr: |
                (min by (compose_service) (docker_container_up{compose_project="boom",compose_service="api"}) or on() vector(0))
                  and on() (min(up{job="docker-metadata"}) == 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        # The healthcheck is 10s x 5 retries, so the container is already ~50s
        # into the fault before it reports unhealthy; 3m on top of that rides
        # out a restart without waiting long to page on a real outage.
        for: 3m
        # NoData used to mean Alerting here, on the reasoning that the series
        # only disappears if the container was removed outright. It also
        # disappears whenever the scrape fails: Prometheus writes stale markers
        # for every series of a failed target immediately, so a few minutes of
        # a struggling docker-metadata-exporter paged as "API is down" while the
        # API was serving traffic normally.
        #
        # The query above now splits those two cases apart, so a missing
        # container alerts on its own terms and the only path left to NoData is
        # the exporter being unreachable -- which observability-blind below
        # already pages for. OK here so that one fault does not page twice,
        # once under a name nobody recognises.
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'The boom API container is not running or is failing its healthcheck'
          description: 'Check `docker ps` for the api container health, then its logs for panics (a panicking actix worker keeps the process alive but fails every request, including `/`).'

      - uid: observability-blind
        title: Container health monitoring is blind
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              # docker-metadata-exporter is the only source of container
              # liveness and healthcheck state, so while it is unreachable the
              # api-down rule above cannot fire at all. That silence is the
              # thing worth paging on -- but as itself, not as an API outage.
              #
              # min() covers the multi-target case; the outer `or vector(0)`
              # covers the target vanishing from the Prometheus config
              # entirely, which no NoData handling would otherwise catch as a
              # failure of *this* rule's own datasource.
              expr: |
                min(up{job="docker-metadata"}) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        # Longer than api-down's 3m: a couple of missed scrapes while the Docker
        # daemon is busy with an image build is normal on this host (it also
        # runs the self-hosted Actions runner), and unlike a real outage there
        # is nothing to lose by confirming it first.
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus cannot scrape docker-metadata-exporter, so container health alerts are silent'
          description: 'The API-down and container health alerts depend on this exporter and cannot fire while it is unreachable. Check the docker-metadata-exporter and docker-socket-proxy containers and the Prometheus targets page.'

  - orgId: 1
    name: pipeline
    folder: boom
    interval: 1m
    rules:
      - uid: valkey-queue-backed-up
        title: Valkey alert queue is not draining
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              # Two conditions, both required:
              #
              #   1. min_over_time > 50k -- the queue's low-water mark over the last
              #      30m is still above the threshold: even at its emptiest it never
              #      drained. A transient spike that clears within 30m won't trip this.
              #   2. deriv(...) >= 0 -- the queue is flat or growing. This is the
              #      actual fault signal. Do NOT reintroduce a rate/ETA test here: a
              #      backlog that legitimately takes weeks to chew through is still
              #      draining and must stay silent, so we ask only whether the number
              #      is moving down at all, never how fast.
              #
              # deriv is a least-squares slope (items/sec) over the window, not an
              # endpoint diff, so a single scrape blip can't flip its sign. 15m is
              # deliberate: at a 15s scrape that is ~60 samples for the regression,
              # and it tolerates batchy consumers that can sit still for a minute or
              # two between chunks. Shortening it toward 1m makes the alert flap on
              # exactly those slow-but-healthy queues.
              expr: |
                max by (key) (
                    (min_over_time(redis_key_size{key=~".*_queue.*"}[30m]) > 50000)
                  and
                    (deriv(redis_key_size{key=~".*_queue.*"}[15m]) >= 0)
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        # The 30m min_over_time window already requires the queue to have stayed
        # backed up continuously, so a short "for" is enough to debounce.
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Valkey queue {{ $labels.key }} stayed above 50k for 30m and stopped moving'
          description: 'A worker pool is making no headway on its upstream queue: the queue never dipped below 50k in the last 30m, and its depth has been flat or growing for the last 15m. Check scheduler logs/traces and worker health. A backlog that is draining slowly -- even one that will take days or weeks -- will not fire this; only one that has stopped going down.'

      - uid: scheduler-worker-pool-degraded
        title: Scheduler worker pool degraded (dead workers)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              # Number of configured workers that are not currently live, per
              # survey/worker_type. > 0 means workers have crashed and the
              # supervisor has not (or can no longer) respawn them. The `for`
              # below is longer than the supervisor's restart backoff so a
              # transient crash that self-heals does not page.
              expr: |
                max by (survey, worker_type) (scheduler_worker_total)
                  - max by (survey, worker_type) (scheduler_worker_live)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.survey }} {{ $labels.worker_type }} worker pool degraded'
          description: 'One or more {{ $labels.survey }} {{ $labels.worker_type }} workers have died and not been respawned (the scheduler''s supervisor gives up after repeated rapid crashes). The corresponding Valkey queue will stop draining. Check scheduler logs for "{{ $labels.worker_type }} worker failed" and the attached error.'
