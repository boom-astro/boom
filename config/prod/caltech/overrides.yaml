babamul:
  webapp_url: https://babamul.caltech.edu
  oauth:
    redirect_base_url: https://babamul.caltech.edu/api

gpu:
  device_ids: [0]

# Reads UMN's NRP collection. Credentials come from BOOM_MILVUS__USERNAME / __PASSWORD.
milvus:
  read_embeddings: true

kafka:
  producer:
    server: "broker:29092"

linker:
  fast_live_every_minutes: 60

workers:
  ztf:
    alert:
      n_workers: 8
    enrichment:
      n_workers: 12
    filter:
      n_workers: 4
  lsst:
    alert:
      n_workers: 10
    enrichment:
      n_workers: 10
    filter:
      n_workers: 4
  decam:
    alert:
      n_workers: 1
    enrichment:
      n_workers: 1
    filter:
      n_workers: 1

# Off until each is ingested on this deployment, see docs/catalogs.md.
crossmatch:
  ztf:
    eRASS1_Main: null
    5XMM_DR15: null
    2SXPS: null
    4FGL_DR4: null
  lsst:
    eRASS1_Main: null
    5XMM_DR15: null
    2SXPS: null
    4FGL_DR4: null
  decam:
    eRASS1_Main: null
    5XMM_DR15: null
    2SXPS: null
    4FGL_DR4: null
  winter:
    eRASS1_Main: null
    5XMM_DR15: null
    2SXPS: null
    4FGL_DR4: null
