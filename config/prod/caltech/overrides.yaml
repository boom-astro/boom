babamul:
  webapp_url: https://babamul.caltech.edu
  oauth:
    redirect_base_url: https://babamul.caltech.edu/api

gpu:
  device_ids: [0]

kafka:
  producer:
    server: "broker:29092"

workers:
  ztf:
    alert:
      n_workers: 8
    enrichment:
      n_workers: 12
    filter:
      n_workers: 4
  lsst:
    alert:
      n_workers: 10
    enrichment:
      n_workers: 10
    filter:
      n_workers: 4
  decam:
    alert:
      n_workers: 1
    enrichment:
      n_workers: 1
    filter:
      n_workers: 1

crossmatch:
  ztf:
    # CatWISE2020 is post-cryogenic and carries only W1/W2; AllWISE is the source
    # of W3/W4, which ORACLE's static feature vector expects.
    AllWISE:
      radius: 2.0
      use_distance: false
      projection:
        _id: 1
        ra: 1
        dec: 1
        w1mpro: 1
        w2mpro: 1
        w3mpro: 1
        w4mpro: 1
