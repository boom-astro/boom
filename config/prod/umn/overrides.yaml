babamul:
  webapp_url: https://babamul.umn.edu
  oauth:
    redirect_base_url: https://babamul.umn.edu/api

gpu:
  device_ids: [0, 1]

# The NRP Milvus collection is UMN's, so UMN is the only deployment that writes it.
# Credentials come from BOOM_MILVUS__USERNAME / __PASSWORD.
milvus:
  read_embeddings: true
  write_embeddings: true

kafka:
  consumer:
    decam:
      server: "vm051.bridges2.psc.edu:9093"

workers:
  ztf:
    alert:
      n_workers: 10
    enrichment:
      n_workers: 4
      batch_size: 250
    filter:
      n_workers: 10
  lsst:
    alert:
      n_workers: 10
    enrichment:
      n_workers: 9
    filter:
      n_workers: 3
  decam:
    alert:
      n_workers: 1
    enrichment:
      n_workers: 1
    filter:
      n_workers: 1

# Off until each is ingested on this deployment, see docs/catalogs.md.
crossmatch:
  ztf:
    eRASS1_Main: null
    5XMM_DR15: null
    2SXPS: null
    4FGL_DR4: null
    watchlist_supernovas:
      radius: 2.0
      use_distance: false
      projection:
        _id: 1
        classification: 1
        redshift: 1
        distance_mpc: 1
        discovery_date: 1
  lsst:
    eRASS1_Main: null
    5XMM_DR15: null
    2SXPS: null
    4FGL_DR4: null
    watchlist_supernovas:
      radius: 2.0
      use_distance: false
      projection:
        _id: 1
        classification: 1
        redshift: 1
        distance_mpc: 1
        discovery_date: 1
  decam:
    eRASS1_Main: null
    5XMM_DR15: null
    2SXPS: null
    4FGL_DR4: null
  winter:
    eRASS1_Main: null
    5XMM_DR15: null
    2SXPS: null
    4FGL_DR4: null
