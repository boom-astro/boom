babamul:
  webapp_url: https://babamul.umn.edu
  oauth:
    redirect_base_url: https://babamul.umn.edu/api

gpu:
  device_ids: [0, 1]

workers:
  ztf:
    alert:
      n_workers: 10
    enrichment:
      n_workers: 4
      batch_size: 250
    filter:
      n_workers: 10
  lsst:
    enrichment:
      n_workers: 9
    filter:
      n_workers: 3

crossmatch:
  ztf:
    DESI_DR1:
      type_key: null
      stellar_types: null
    PS1_DR2: null
    AllWISE:
      radius: 2.0
      use_distance: false
      projection:
        _id: 1
        ra: 1
        dec: 1
        w1mpro: 1
        w2mpro: 1
        w3mpro: 1
        w4mpro: 1
    watchlist_supernovas:
      radius: 2.0
      use_distance: false
      # For watchlists, projection picks the fields surfaced under annotations.watchlist.
      projection:
        _id: 1
        classification: 1
        redshift: 1
        distance_mpc: 1
        discovery_date: 1
  lsst:
    DESI_DR1:
      type_key: null
      stellar_types: null
    PS1_DR2: null
    watchlist_supernovas:
      radius: 2.0
      use_distance: false
      # For watchlists, projection picks the fields surfaced under annotations.watchlist.
      projection:
        _id: 1
        classification: 1
        redshift: 1
        distance_mpc: 1
        discovery_date: 1
