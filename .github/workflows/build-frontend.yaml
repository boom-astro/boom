name: Create and publish the frontend image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  # Separate from build.yaml because the two images share nothing: this one is
  # bun + nginx and takes a couple of minutes, where the boom image is a Rust
  # build with a cargo cache round-trip. Keeping them apart means a frontend
  # change does not wait on a Rust build, and a failure in one is legible.
  build:
    name: Build and push frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Both architectures in one job, unlike the boom image: this build is
      # minutes rather than tens of minutes, so QEMU for arm64 costs less than
      # the digest round-trip a native matrix would need.
      #
      # Deliberately built with NEUTRAL VITE values, not a deployment's. Vite
      # inlines `import.meta.env.VITE_*` into the bundle at build time, so an
      # image built with one deployment's PostHog key would send another
      # deployment's analytics to the wrong project. Empty disables analytics,
      # which is the safe default; the API origin is already injected at
      # container start by the entrypoint, so it is not baked here.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_PRERELEASE_MODE=false
            VITE_PUBLIC_POSTHOG_KEY=
            VITE_PUBLIC_POSTHOG_HOST=
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache,mode=max

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # An unforgeable statement about where and how the image was built, as the
      # boom image gets.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
