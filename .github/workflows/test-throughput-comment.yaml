name: Throughput test PR body

# Rewrites a managed section at the bottom of the PR body with the throughput
# results.
#
# This is split out from test-throughput.yaml on purpose: for pull requests
# opened from a fork, the GITHUB_TOKEN of the `pull_request` workflow is forced
# read-only by GitHub, so it cannot edit the PR (403 "Resource not accessible by
# integration"). A `workflow_run` workflow instead runs in the context of the
# base repository and gets a writable token, even when the triggering run came
# from a fork.

on:
  workflow_run:
    workflows: ["Throughput test"]
    types:
      - completed

# The body update is a read-modify-write, so runs must not overlap.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  update-body:
    name: Update PR body with throughput results
    runs-on: ubuntu-latest
    # `failure` included: the payload is uploaded before the tolerance check.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    permissions:
      pull-requests: write
      actions: read # cross-run artifact download
    steps:
      - name: Download results payload
        id: download
        continue-on-error: true # no payload when aggregate didn't run
        uses: actions/download-artifact@v4
        with:
          name: throughput-pr-body
          path: ./results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the pull request
        id: pr
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # From the event payload: a fork controls the artifact, not this.
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls" \
            -X GET -f state=open -f "head=${HEAD_REPO%%/*}:$HEAD_BRANCH" \
            --jq 'first(.[]) | "\(.number) \(.head.sha)"')
          if [ -z "$pr" ]; then
            echo "::warning::no open PR for $HEAD_REPO:$HEAD_BRANCH; nothing to update"
            exit 0
          fi
          read -r number sha <<< "$pr"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
      - name: Update PR body
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          baseline_link=$(cat ./results/baseline_link.txt)

          # Everything below the marker is rewritten on every run.
          marker="<!-- Don't edit below this line: this section is managed by the GitHub Actions bot. -->"

          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')
          # Bodies come back CRLF; the match and trim below assume LF.
          body=${body//$'\r'/}
          body=${body%%"$marker"*}
          # Trailing blank lines would double up the separator below.
          body=$(printf '%s' "$body" | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}')

          {
            if [ -n "$body" ]; then
              printf '%s\n\n' "$body"
            fi
            printf '%s\n\n' "$marker"
            printf '## Throughput test results\n\n'
            printf 'Results for `%s`:\n\n' "$SHA"
            cat ./results/table.md
            printf '\nBaseline runs: %s\n' "$baseline_link"
          } > new_body.md

          jq -n --rawfile body new_body.md '{body: $body}' > payload.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --input payload.json
