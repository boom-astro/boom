name: Frontend

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile so a dependency that drifted from bun.lock fails here
      # rather than being silently resolved to something the image never saw.
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: bun run test

  build:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create default .env file
        run: cp .env.example .env

      # Build the production (nginx) frontend image, which runs `tsc -b && vite
      # build` and so fails on type or build errors. Use only the base compose
      # file so the dev override (Vite dev server) doesn't take over the target.
      - name: Build frontend Docker image
        run: docker compose -f docker-compose.yaml --profile frontend build frontend
