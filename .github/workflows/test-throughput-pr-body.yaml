name: Throughput test PR body

# Appends the throughput results to a managed section at the bottom of the PR
# body: one row per storage type per commit, so the table is a history of the
# branch rather than just its latest run.
#
# This is split out from test-throughput.yaml on purpose: for pull requests
# opened from a fork, the GITHUB_TOKEN of the `pull_request` workflow is forced
# read-only by GitHub, so it cannot edit the PR (403 "Resource not accessible by
# integration"). A `workflow_run` workflow instead runs in the context of the
# base repository and gets a writable token, even when the triggering run came
# from a fork.

on:
  workflow_run:
    workflows: ["Throughput test"]
    types:
      - completed

jobs:
  update-body:
    name: Update PR body with throughput results
    runs-on: ubuntu-latest
    # `failure` included: the payload is uploaded before the tolerance check.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    permissions:
      pull-requests: write
      actions: read # cross-run artifact download
    steps:
      - name: Download results payload
        id: download
        continue-on-error: true # no payload when aggregate didn't run
        uses: actions/download-artifact@v4
        with:
          name: throughput-pr-body
          path: ./results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update PR body
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          pr_number=$(cat ./results/pr_number.txt)
          baseline_link=$(cat ./results/baseline_link.txt)

          # Everything from this marker on belongs to the workflow: it is
          # rewritten on every run, so edits below it do not survive.
          marker="<!-- Don't edit below this line: this section is managed by the GitHub Actions bot. -->"
          header="| Commit | Storage | Wall time | Baseline median | Difference |"
          divider="| ------ | ------- | --------- | --------------- | ---------- |"

          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.body // ""')
          # GitHub stores bodies with CRLF line endings; drop the CRs so the
          # marker match and the row parsing below behave.
          body=${body//$'\r'/}

          # Split the hand-written part from the section we manage.
          managed=""
          if [[ "$body" == *"$marker"* ]]; then
            managed=${body#*"$marker"}
            body=${body%%"$marker"*}
          fi

          # Keep the earlier commits' rows, minus any for the commits in this
          # run, so a re-run replaces its own rows instead of duplicating them.
          commits=$(awk -F'|' '{ gsub(/ /, "", $2); print $2 }' ./results/rows.md | sort -u)
          previous=$(printf '%s\n' "$managed" | grep -E '^\| `[0-9a-f]+` \|' || true)
          while read -r commit; do
            [ -n "$commit" ] || continue
            previous=$(printf '%s\n' "$previous" | grep -vF "| $commit |" || true)
          done <<< "$commits"

          # Trim trailing blank lines so the separator below is the only gap.
          body=$(printf '%s' "$body" | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}')

          {
            if [ -n "$body" ]; then
              printf '%s\n\n' "$body"
            fi
            printf '%s\n\n' "$marker"
            printf '## Throughput test results\n\n'
            printf '%s\n%s\n' "$header" "$divider"
            if [ -n "$previous" ]; then
              printf '%s\n' "$previous"
            fi
            cat ./results/rows.md
            printf '\nBaseline runs (latest): %s\n' "$baseline_link"
          } > new_body.md

          jq -n --rawfile body new_body.md '{body: $body}' > payload.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --input payload.json
