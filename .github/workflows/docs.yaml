name: Docs

on:
  push:
    branches: ["main"]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yaml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Only PR runs are superseded; main keeps one run, and one status, per commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # mkdocs.yml sets strict, so a link into the source tree that was written
      # as a relative path, or a nav entry for a file that was renamed, fails
      # here instead of reaching the published site.
      - name: Build
        run: >-
          uv run --with mkdocs-material==9.7.7 mkdocs build --strict
          --site-dir _site

      - name: Check links into the source tree
        run: |
          status=0
          for path in $(grep -rhoE 'https://github\.com/boom-astro/boom/blob/main/[^)#[:space:]]+' docs | sed 's|.*/blob/main/||' | sort -u); do
            [ -e "$path" ] || { echo "::error::docs link to a missing file: $path"; status=1; }
          done
          exit $status

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
