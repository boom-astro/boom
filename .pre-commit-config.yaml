repos:
  # boompy is the only Python in the tree, and its `pyproject.toml` sets the
  # line length, so the hooks need no arguments. `ruff-check` fixes what it can
  # (import sorting, unused imports) and fails on the rest.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^boompy/.*\.py$
      - id: ruff-format
        files: ^boompy/.*\.py$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with rustfmt.
        entry: bash -c 'cargo fmt'
        language: rust
        files: \.rs$
        args: []
      - id: frontend-tsc
        name: frontend tsc
        description: Type-check the frontend.
        entry: bash -c 'cd frontend && bun run tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        description: Lint the frontend with ESLint.
        entry: bash -c 'cd frontend && bun run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
