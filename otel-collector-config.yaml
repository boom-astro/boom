receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

# Add the Prometheus exporter to expose metrics on port 8888
exporters:
  logging:
    loglevel: debug
  
  # Add Prometheus exporter - exposes metrics on port 8888/metrics
  prometheus:
    endpoint: "0.0.0.0:8888"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      exporters: [prometheus]  # Changed from logging to prometheus
