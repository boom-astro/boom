# GPU override — use with: docker compose -f docker-compose.yaml -f docker-compose.cuda.yaml up
# Requires NVIDIA Container Toolkit on the host.

volumes:
  nvidia_compute_cache:

services:
  # enrich_reprocess loads the ONNX models in-process rather than handing work
  # to the enrichment workers, so on a GPU deployment the task worker has to run
  # where the GPU is. There is one task worker, and it claims whatever is
  # queued, so this image also carries boompy for catalog ingests.
  #
  # A consequence worth knowing: a long catalog ingest occupies the GPU box for
  # its duration, because a worker runs one task at a time. Splitting CPU and
  # GPU work needs claim-time routing, which does not exist yet -- see
  # docs/task-system.md.
  task-worker:
    image: ${BOOM_GPU_IMAGE:-boom-astro/boom-gpu:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      BOOM_GPU__ENABLED: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - nvidia_compute_cache:/root/.nv/ComputeCache
  scheduler-ztf:
    image: ${BOOM_GPU_IMAGE:-boom-astro/boom-gpu:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      BOOM_GPU__ENABLED: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - nvidia_compute_cache:/root/.nv/ComputeCache
  scheduler-lsst:
    image: ${BOOM_GPU_IMAGE:-boom-astro/boom-gpu:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      BOOM_GPU__ENABLED: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - nvidia_compute_cache:/root/.nv/ComputeCache
