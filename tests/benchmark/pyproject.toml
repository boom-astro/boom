[project]
name = "boom-benchmark"
version = "0.1.0"
description = "End-to-end, multi-survey benchmark harness for BOOM (see README.md)"
requires-python = ">=3.13,<3.15"
dependencies = [
    "astropy>=6.1",
    "astropy-healpix>=1.0",
    "confluent-kafka>=2.5",
    "fastavro>=1.9",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyjwt>=2.8",
    "pymilvus>=2.5",
    "pymongo>=4.8",
    "pyyaml>=6.0",
    "redis>=5.0",
    "requests>=2.32",
]

[tool.uv]
package = false
