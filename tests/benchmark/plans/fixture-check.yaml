# The same replay on the sliced seed and on a full snapshot, at one commit.
# Afterwards: compare_runs.py <slice run> <full run>. Identical links, hosts
# and filter passes mean the slice is complete; the throughput difference is
# the bias slicing introduces. Build the full seed under its own data root.
name: fixture-check
repeats: 1
defaults:
  bundle: [~/boom-bench/bundles/ztf-NIGHT, ~/boom-bench/bundles/lsst-NIGHT]
  # align: absolute
  # mode: realtime
  # speed: 1
  mode: drain
  profile: [production]
  window-seconds: 3600
  window-start: 0        # the first hour of each survey's night: the seed's cut
  cache: cold
steps:
  - {name: slice, data-root: ~/boom-bench}
  - {name: full, data-root: ~/boom-bench-full}
